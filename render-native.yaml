# Render Blueprint for Behavioral Graph Web App
# Native Python runtime - FASTER builds than Docker
# Use this if Docker deployments are timing out
#
# To use: Rename this file to render.yaml or update your Render service
# to use "runtime: python" instead of "runtime: docker"
#
# Scaling: See render.yaml comments. Use GUNICORN_* env vars and Dashboard > Scaling for autoscaling (Pro).

services:
  - type: web
    name: behavioral-graph
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /healthz
    envVars:
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        value: midgenow!2
      - key: FLASK_DEBUG
        value: "false"
      # Snowflake credentials - set these in Render dashboard
      - key: SNOWFLAKE_USER
        sync: false
      - key: SNOWFLAKE_PASSWORD
        sync: false
      - key: SNOWFLAKE_ACCOUNT
        sync: false
      - key: SNOWFLAKE_TOKEN
        sync: false
      - key: SNOWFLAKE_WAREHOUSE
        value: "BEHAVIORGRAPH6X"
      - key: SNOWFLAKE_DATABASE
        value: "BEHAVIORALGRAPH"
      - key: SNOWFLAKE_SCHEMA
        value: "PUBLIC"
      - key: SNOWFLAKE_ROLE
        value: "ACCOUNTADMIN"
      # SMTP Email Configuration (fallback)
      - key: SMTP_SERVER
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: "no_reply@crosswalknyc.com"
      - key: SMTP_PASSWORD
        value: "Token7778"
      - key: FROM_EMAIL
        value: "no_reply@crosswalknyc.com"
      # Google OAuth for Gmail API (set in Render dashboard)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_URL
        value: "https://behavioralgraph.onrender.com"
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "300"