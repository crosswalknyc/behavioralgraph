<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="60" fill="transparent"/>
  
  <!-- Icon - Abstract graph/connection symbol -->
  <g transform="translate(5, 8)">
    <!-- Node connections -->
    <circle cx="8" cy="22" r="4" fill="#5a9ad9"/>
    <circle cx="22" cy="8" r="3" fill="#66d9ef"/>
    <circle cx="22" cy="36" r="3" fill="#66d9ef"/>
    <circle cx="36" cy="22" r="4" fill="#5a9ad9"/>
    
    <!-- Lines connecting nodes -->
    <line x1="11" y1="20" x2="19" y2="10" stroke="#5a9ad9" stroke-width="1.5" opacity="0.7"/>
    <line x1="11" y1="24" x2="19" y2="34" stroke="#5a9ad9" stroke-width="1.5" opacity="0.7"/>
    <line x1="25" y1="10" x2="33" y2="20" stroke="#66d9ef" stroke-width="1.5" opacity="0.7"/>
    <line x1="25" y1="34" x2="33" y2="24" stroke="#66d9ef" stroke-width="1.5" opacity="0.7"/>
    <line x1="22" cy="11" x2="22" y2="33" stroke="#4a8ac9" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- MIDG Text -->
  <text x="50" y="32" font-family="Arial Black, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#e6f1ff" letter-spacing="-1">MIDG</text>
  
  <!-- Media Identity Graph subtitle -->
  <text x="50" y="48" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#8892b0" letter-spacing="0.5">Media Identity Graph</text>
</svg>
