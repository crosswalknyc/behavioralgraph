<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 220" width="140" height="220">
  <style>
    .logo-text { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 900; font-size: 38px; fill: white; letter-spacing: 1px; }
    .plus { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 400; font-size: 34px; fill: white; }
  </style>
  <text x="5" y="40" class="logo-text">CR</text>
  <text x="5" y="80" class="logo-text">OS</text>
  <text x="5" y="120" class="logo-text">S</text>
  <text x="5" y="160" class="logo-text">WA</text>
  <text x="5" y="200" class="logo-text">LK</text>
  <text x="100" y="200" class="plus">+</text>
</svg>
