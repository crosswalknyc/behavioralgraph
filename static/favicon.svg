<?xml version="1.0" encoding="UTF-8"?>
<!-- Crosswalk favicon: the collapsed Prometheus launcher circle.
     Same geometry as #prometheusLauncher .pm-launcher-avatar in
     templates/index.html: a 32px circle filled with the 135deg
     Cobalt -> Orchid gradient, holding an 18px Crosswalk slash mark
     (viewBox 0 0 64 64, skewX(-14), three rects in Off-White).
     The 18/32 ratio is reproduced here as scale(0.5625) inside a
     64x64 box so the mark sits exactly where the launcher puts it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cwLauncher" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3358FF"/>
      <stop offset="1" stop-color="#E682FF"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#cwLauncher)"/>
  <g transform="translate(14,14) scale(0.5625)">
    <g transform="skewX(-14)" fill="#E9E8E1">
      <rect x="24" y="10" width="8.5" height="44" rx="1.75"/>
      <rect x="37" y="10" width="8.5" height="44" rx="1.75"/>
      <rect x="50" y="10" width="8.5" height="44" rx="1.75"/>
    </g>
  </g>
</svg>
