# Render Blueprint for Behavioral Graph Web App
# Using Docker for precise Python version control

services:
  - type: web
    name: behavioral-graph
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        value: midgenow!2
      - key: FLASK_DEBUG
        value: "false"
      # Snowflake credentials - set these in Render dashboard
      - key: SNOWFLAKE_USER
        sync: false
      - key: SNOWFLAKE_PASSWORD
        sync: false
      - key: SNOWFLAKE_ACCOUNT
        sync: false
      - key: SNOWFLAKE_TOKEN
        sync: false
      - key: SNOWFLAKE_WAREHOUSE
        value: "BEHAVIORGRAPH6X"
      - key: SNOWFLAKE_DATABASE
        value: "BEHAVIORALGRAPH"
      - key: SNOWFLAKE_SCHEMA
        value: "PUBLIC"
      - key: SNOWFLAKE_ROLE
        value: "ACCOUNTADMIN"
      # SMTP Email Configuration
      - key: SMTP_SERVER
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: "no_reply@crosswalknyc.com"
      - key: SMTP_PASSWORD
        value: "Token7778"
      - key: FROM_EMAIL
        value: "no_reply@crosswalknyc.com"
    healthCheckPath: /api/health
