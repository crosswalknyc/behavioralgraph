<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password | Crosswalk IQ+</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a1929;
            --bg-card: #0d2137;
            --bg-input: #132f4c;
            --accent-blue: #5a9ad9;
            --accent-cyan: #66d9ef;
            --accent-red: #f92672;
            --text-primary: #e6f1ff;
            --text-secondary: #8892b0;
            --border-color: #1e3a5f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a1929 0%, #0d2137 50%, #132f4c 100%);
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        h1 { font-size: 1.25rem; color: var(--accent-cyan); margin-bottom: 0.5rem; }
        p { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }
        input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: var(--accent-blue); }
        .btn {
            width: 100%;
            padding: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent-blue), #4a8ac9);
            color: white;
            margin-top: 0.5rem;
        }
        .btn:hover { opacity: 0.95; }
        .error-message {
            background: rgba(249, 38, 114, 0.1);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
        .error-message.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Set your password</h1>
            <p>Your account was restored. Please set a new password to continue.</p>
            <div class="error-message" id="errorMessage"></div>
            <form id="setPasswordForm">
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input type="password" id="newPassword" name="new_password" required minlength="8" placeholder="At least 8 characters">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" name="confirm_password" required minlength="8" placeholder="Same as above">
                </div>
                <button type="submit" class="btn" id="submitBtn">Set password & continue</button>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('setPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const newP = document.getElementById('newPassword').value;
            const confirmP = document.getElementById('confirmPassword').value;
            const err = document.getElementById('errorMessage');
            const btn = document.getElementById('submitBtn');
            err.classList.remove('show');
            if (newP !== confirmP) {
                err.textContent = 'Passwords do not match.';
                err.classList.add('show');
                return;
            }
            if (newP.length < 8) {
                err.textContent = 'Password must be at least 8 characters.';
                err.classList.add('show');
                return;
            }
            btn.disabled = true;
            btn.textContent = 'Updating…';
            try {
                const res = await fetch('/api/set-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ new_password: newP, confirm_password: confirmP })
                });
                const data = await res.json();
                if (data.success && data.redirect) {
                    window.location.href = data.redirect;
                } else {
                    err.textContent = data.error || 'Something went wrong.';
                    err.classList.add('show');
                    btn.disabled = false;
                    btn.textContent = 'Set password & continue';
                }
            } catch (e) {
                err.textContent = 'Network error. Try again.';
                err.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Set password & continue';
            }
        });
    </script>
</body>
</html>
