<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Crosswalk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#0C1618; --raised:#15252A; --text:#E9E8E1; --body:#9AA09B; --muted:#7C878A;
  --accent:#C7F23E; --border:#27393D; --focus:#3358FF;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--page);color:var(--text);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  font-variation-settings:"opsz" 18;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.wrap{width:min(520px,calc(100% - 40px));margin:auto;padding:48px 0}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--body)}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
h1{font-size:clamp(28px,5vw,40px);font-weight:700;line-height:1.15;margin:28px 0 12px;letter-spacing:-0.01em}
.lede{color:var(--body);font-size:16px;margin:0 0 32px;max-width:36ch}
label{display:block;font-size:13px;color:var(--body);margin-bottom:8px}
input[type=password]{width:100%;font:inherit;font-size:16px;font-weight:500;padding:12px 14px;border-radius:6px;border:1px solid var(--border);background:var(--raised);color:var(--text)}
button{margin-top:16px;font:inherit;font-size:15px;font-weight:700;height:44px;padding:0 22px;border:0;border-radius:6px;background:var(--accent);color:var(--page);cursor:pointer}
button:hover{filter:brightness(1.06)}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.err{color:#E9E8E1;background:var(--raised);border-radius:8px;padding:12px 14px;margin:0 0 20px;font-size:14px}
.foot{padding:24px 0 40px;text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Prepared for CAA</div>
    <h1>This page is locked.</h1>
    <p class="lede">Enter the password to open the annual value model.</p>
    {% if error %}
    <p class="err" role="alert">That password does not match.</p>
    {% endif %}
    <form method="post" action="/caa" autocomplete="current-password">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autofocus>
      <button type="submit">Continue</button>
    </form>
  </div>
  <div class="foot">Crosswalk / Behavioral Intelligence</div>
</body>
</html>
