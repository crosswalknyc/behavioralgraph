<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Profile | MIDG Behavioral Graph</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-card: #161b22;
            --text-primary: #e6f1ff;
            --text-secondary: #8b949e;
            --accent-blue: #4a8ac9;
            --border-color: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        .logo { height: 40px; }
        h1 { font-size: 1.5rem; }
        .badge {
            background: rgba(74, 138, 201, 0.2);
            color: var(--accent-blue);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
        }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .stat-label { color: var(--text-secondary); font-size: 0.85rem; }
        .stat-value { font-size: 2rem; font-weight: 700; margin-top: 0.5rem; }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
        }
        .chart-card {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .chart-card h3 {
            margin-bottom: 1rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }
        .error {
            text-align: center;
            padding: 3rem;
            color: #ef4444;
        }
        canvas { max-width: 100%; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="/static/logo.svg" alt="MIDG" class="logo">
            <h1>Shared Audience Profile</h1>
            <span class="badge">Read Only</span>
        </div>
        
        <div id="content">
            <div class="loading">Loading profile data...</div>
        </div>
    </div>
    
    <script>
        const profileKey = "{{ profile_key }}";
        
        async function loadProfile() {
            try {
                const response = await fetch(`/api/get-csv-data/${encodeURIComponent(profileKey)}`);
                const data = await response.json();
                
                if (data.success && data.data) {
                    renderProfile(data);
                } else {
                    document.getElementById('content').innerHTML = '<div class="error">Could not load profile</div>';
                }
            } catch (e) {
                document.getElementById('content').innerHTML = `<div class="error">Error: ${e.message}</div>`;
            }
        }
        
        function renderProfile(data) {
            const csvData = data.data;
            
            // Parse sample size and demographics
            let sampleSize = 0;
            const demographics = { gender: {}, age: {}, ethnicity: {}, income: {} };
            
            function displayEthnicityLabel(v) {
                if (!v || typeof v !== 'string') return v;
                const x = v.trim().toLowerCase();
                if (x === 'latinx' || x === 'latino') return 'Hispanic or Latino';
                if (x === 'black') return 'Black or African American';
                if (x === 'other') return 'Another Race/Ethnicity';
                return v;
            }
            function normAgeKey(s) {
                if (s == null) return '';
                s = String(s).trim().toLowerCase().replace(/\s*-\s*/g, '-').replace(/\s+/g, ' ');
                return s;
            }
            // Redistribute old age brackets using Original Raw Numbers: split people by ratio into new buckets, then new % = (bucket raw / total age raw) * 100
            function normalizeAgeBucketsFromRaw(ageObj, ageRawObj) {
                const oldToNew = {
                    '<16': [['17 and Under', 1]], 'under 16': [['17 and Under', 1]],
                    '16-18': [['17 and Under', 0.67], ['18-24', 0.33]], '17-18': [['17 and Under', 0.67], ['18-24', 0.33]],
                    '19-20': [['18-24', 1]], '18-20': [['18-24', 1]],
                    '21-25': [['18-24', 0.8], ['25-34', 0.2]], '26-30': [['25-34', 1]],
                    '31-40': [['25-34', 0.4], ['35-44', 0.6]],
                    '41-49': [['35-44', 0.21], ['45-54', 0.53], ['55-64', 0.26]], '41-59': [['35-44', 0.21], ['45-54', 0.53], ['55-64', 0.26]],
                    '60+': [['55-64', 0.25], ['65 or Older', 0.75]], '65+': [['55-64', 0.25], ['65 or Older', 0.75]], 'over 65': [['55-64', 0.25], ['65 or Older', 0.75]]
                };
                const newRaw = {};
                for (const [oldKey, raw] of Object.entries(ageRawObj || {})) {
                    const n = parseInt(String(raw).replace(/,/g, ''), 10) || 0;
                    if (n <= 0) continue;
                    const key = normAgeKey(oldKey);
                    const mapping = oldToNew[key] || oldToNew[(oldKey || '').trim().toLowerCase()] || oldToNew[oldKey];
                    if (mapping) {
                        mapping.forEach(([newBucket, ratio]) => { newRaw[newBucket] = (newRaw[newBucket] || 0) + n * ratio; });
                    } else {
                        newRaw[oldKey] = (newRaw[oldKey] || 0) + n;
                    }
                }
                const total = Object.values(newRaw).reduce((a, b) => a + b, 0);
                if (total <= 0) return ageObj || {};
                const out = {};
                for (const [b, r] of Object.entries(newRaw)) out[b] = Math.round((r / total) * 10000) / 100;
                return out;
            }
            function normalizeAgeBucketsFromPct(ageObj) {
                const oldToNew = { '<16': [['17 and Under', 1]], 'under 16': [['17 and Under', 1]], '16-18': [['17 and Under', 0.67], ['18-24', 0.33]], '17-18': [['17 and Under', 0.67], ['18-24', 0.33]], '19-20': [['18-24', 1]], '18-20': [['18-24', 1]], '21-25': [['18-24', 0.8], ['25-34', 0.2]], '26-30': [['25-34', 1]], '31-40': [['25-34', 0.4], ['35-44', 0.6]], '41-49': [['35-44', 0.21], ['45-54', 0.53], ['55-64', 0.26]], '41-59': [['35-44', 0.21], ['45-54', 0.53], ['55-64', 0.26]], '60+': [['55-64', 0.25], ['65 or Older', 0.75]], '65+': [['55-64', 0.25], ['65 or Older', 0.75]], 'over 65': [['55-64', 0.25], ['65 or Older', 0.75]] };
                const out = {};
                for (const [oldKey, pct] of Object.entries(ageObj || {})) {
                    const key = normAgeKey(oldKey);
                    const mapping = oldToNew[key] || oldToNew[(oldKey || '').trim().toLowerCase()] || oldToNew[oldKey];
                    if (mapping) { mapping.forEach(([newBucket, ratio]) => { out[newBucket] = (out[newBucket] || 0) + pct * ratio; }); } else { out[oldKey] = (out[oldKey] || 0) + pct; }
                }
                return out;
            }
            const ageRaw = {};
            csvData.forEach(row => {
                const col = (row.Column || '').toUpperCase();
                const val = row.Value || '';
                const pct = parseFloat(row['Brand Penetration (Row)'] || row['Category Share'] || row['Percentage'] || 0) || 0;
                const raw = parseInt(String(row['Original Raw Numbers'] || '0').replace(/,/g, ''), 10) || 0;
                if (col === 'SAMPLE SIZE') {
                    const raw = parseInt(String(row['Original Raw Numbers'] || '0').replace(/,/g, ''), 10) || 0;
                    sampleSize = raw > 0 ? raw : parseInt(row['Category Share'] || 0);
                }
                if (col === 'GENDER' && val) demographics.gender[val] = pct;
                if (col === 'AGE' && val) {
                    demographics.age[val] = pct;
                    if (raw > 0) ageRaw[val] = raw;
                }
                if (col === 'ETHNICITY' && val) demographics.ethnicity[displayEthnicityLabel(val)] = pct;
                if (col === 'INCOME' && val) demographics.income[val] = pct;
            });
            let projectedUS = 0;
            if (sampleSize < 1000 && csvData[3]) {
                const row4ColE = parseInt(String(csvData[3]['Original Raw Numbers'] || csvData[3][4] || '0').replace(/,/g, ''), 10) || 0;
                if (row4ColE > 0) {
                    sampleSize = row4ColE;
                    if (csvData[2]) {
                        const f3 = parseInt(String(csvData[2]['US Gen Pop Projection'] || csvData[2]['Gen Pop Projection'] || csvData[2][5] || '0').replace(/,/g, ''), 10) || 0;
                        if (f3 > 0) projectedUS = f3;
                    }
                }
            }
            if (projectedUS === 0) projectedUS = Math.round((sampleSize / 10000000) * 324700000);
            if (Object.keys(ageRaw).length === 0 && Object.keys(demographics.age).length > 0 && sampleSize > 0) {
                for (const [k, p] of Object.entries(demographics.age)) ageRaw[k] = Math.max(0, Math.round((p / 100) * sampleSize));
            }
            demographics.age = Object.keys(ageRaw).length > 0 ? normalizeAgeBucketsFromRaw(demographics.age, ageRaw) : normalizeAgeBucketsFromPct(demographics.age);
            
            document.getElementById('content').innerHTML = `
                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-label">Sample Size</div>
                        <div class="stat-value">n=${sampleSize.toLocaleString()}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Projected US</div>
                        <div class="stat-value">${projectedUS.toLocaleString()}</div>
                    </div>
                </div>
                <div class="charts-grid">
                    <div class="chart-card"><h3>Gender</h3><canvas id="genderChart"></canvas></div>
                    <div class="chart-card"><h3>Age</h3><canvas id="ageChart"></canvas></div>
                    <div class="chart-card"><h3>Ethnicity</h3><canvas id="ethnicityChart"></canvas></div>
                    <div class="chart-card"><h3>Income</h3><canvas id="incomeChart"></canvas></div>
                </div>
            `;
            
            // Render charts
            const chartColors = ['#4a8ac9', '#10b981', '#f97316', '#ec4899', '#8b5cf6', '#06b6d4'];
            
            function createChart(id, labels, values) {
                if (typeof Chart === 'undefined') {
                    console.error('Chart.js not loaded');
                    return;
                }
                new Chart(document.getElementById(id), {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: values,
                            backgroundColor: chartColors.slice(0, labels.length)
                        }]
                    },
                    options: {
                        plugins: {
                            legend: { position: 'right', labels: { color: '#e6f1ff' } }
                        }
                    }
                });
            }
            
            createChart('genderChart', Object.keys(demographics.gender), Object.values(demographics.gender));
            createChart('ageChart', Object.keys(demographics.age), Object.values(demographics.age));
            createChart('ethnicityChart', Object.keys(demographics.ethnicity), Object.values(demographics.ethnicity));
            createChart('incomeChart', Object.keys(demographics.income), Object.values(demographics.income));
        }
        
        loadProfile();
    </script>
</body>
</html>
