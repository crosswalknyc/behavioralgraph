# nginx site config for bg-webapp.
#
# Location on host: /etc/nginx/sites-available/bg-webapp
#   (symlink from /etc/nginx/sites-enabled/bg-webapp)
#
# Before Jenna approves the DNS cutover, the primary hostname
# `behavioralgraph.crosswalknyc.com` block is served without TLS on :80
# only. Certbot writes the :443 + HSTS block once a staging hostname is
# assigned (see deploy/hetzner/README.md).
#
# The staging + primary hostnames are placeholders below - certbot
# rewrites them in place when TLS is enabled.

# --- Upstream ---------------------------------------------------------------
upstream bg_webapp_upstream {
    # bg-webapp systemd unit binds to 127.0.0.1:8000 (see bg-webapp.service).
    # Gunicorn 3 x 4 threads. Keepalive keeps proxy connections warm.
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# --- Log format that captures upstream latency separately -----------------
log_format bg_webapp_json escape=json '{'
    '"ts":"$time_iso8601",'
    '"remote":"$remote_addr",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"path":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"req_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"'
    '}';

# --- Rate limit for /api/ (protects against runaway loops from ONE client) --
# 300r/s + burst=600 is a wide margin - legitimate dashboard use (many
# tabs polling /api/user/status, /api/notifications, etc. from the same
# NAT'd office IP) never bumps it, but a runaway loop from ONE bad
# client still trips the limiter fast. Tighten if abuse is observed.
limit_req_zone $binary_remote_addr zone=bg_webapp_api:10m rate=300r/s;
limit_req_status 429;

# --- Default server: reject unknown Host headers ---------------------------
# This catches internet bot traffic hitting our public IP with junk Host
# headers (or IP directly). 444 = close connection without response, so
# we don't waste CPU rendering an error page for a scanner.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # Serve the ACME challenge even for the default server so cert issuance
    # via IP-served staging still works.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 444;
    }
}

# --- Server block (HTTP - certbot will add the TLS server block later) -----
server {
    listen 80;
    listen [::]:80;

    # Certbot rewrites these when TLS is issued.
    server_name  staging-app.crosswalknyc.com  behavioralgraph.crosswalknyc.com  behavioralgraph.onrender.com;

    # ACME challenge (certbot --webroot mode; certbot --nginx handles this too).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # ----- Body + timeout headers --------------------------------------
    # Journey IQ + Analysis IQ requests can run up to 10 minutes on the
    # backend (Prometheus analyze, heavy interpret bundles). Keep the
    # nginx proxy timeout above gunicorn's timeout (600s + 30s graceful
    # + margin) so nginx does not 504 before gunicorn responds.
    client_max_body_size 32M;
    client_body_timeout 60s;
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;
    proxy_connect_timeout 15s;

    # ----- Security headers -------------------------------------------
    # HSTS is added by certbot in the TLS server block; do not add here.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Permissive CSP - the dashboard loads inline scripts + external
    # CDN fonts + iframes. Tighten later, do not tighten in this
    # migration workstream.
    add_header X-XSS-Protection "1; mode=block" always;

    # ----- gzip --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        application/xml
        text/css
        text/plain
        text/xml
        image/svg+xml;
    gzip_disable "msie6";

    # ----- Access log --------------------------------------------------
    access_log /var/log/nginx/bg-webapp.access.log bg_webapp_json;
    error_log  /var/log/nginx/bg-webapp.error.log warn;

    # ----- /api/* rate limit ------------------------------------------
    location /api/ {
        limit_req zone=bg_webapp_api burst=600 nodelay;

        proxy_pass         http://bg_webapp_upstream;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";

        proxy_buffering off;
        proxy_redirect  off;
    }

    # ----- Health check bypass ----------------------------------------
    # /healthz is not rate-limited so external monitors + kubelet-style
    # probes work reliably.
    location = /healthz {
        proxy_pass         http://bg_webapp_upstream/healthz;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        access_log off;
    }
    location = /health {
        proxy_pass         http://bg_webapp_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        access_log off;
    }

    # ----- Everything else --------------------------------------------
    location / {
        proxy_pass         http://bg_webapp_upstream;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";

        proxy_buffering off;
        proxy_redirect  off;
    }
}
